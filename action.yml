name: "HushSpec"
description: "Validate, lint, test, audit and verify HushSpec policy documents with the h2h CLI"
author: "HushSpec"
branding:
  icon: "shield"
  color: "purple"

inputs:
  command:
    description: >-
      h2h subcommand to run: validate, lint, test, audit, or bundle-verify.
    required: false
    default: validate
  paths:
    description: >-
      Glob pattern(s) of policy/fixture/bundle files to operate on, one per
      line or space-separated (e.g. "rulesets/*.yaml" or
      "library/**/*.yaml"). Required -- a run with no matching files fails
      closed rather than silently succeeding.
    required: false
    default: ""
  version:
    description: >-
      h2h release to install: a release tag (e.g. "v1.0.0"), "latest" for
      the newest GitHub release, or "source" to build
      crates/hushspec-cli from this action's own checkout (no release
      binaries required; needs a Rust toolchain, installed automatically).
    required: false
    default: latest
  fail-on-warnings:
    description: 'Pass --fail-on-warnings to "h2h lint" (ignored by other commands).'
    required: false
    default: "false"
  format:
    description: >-
      Output format forwarded to h2h as --format: text or json for every
      command, plus sarif for lint and junit for test. Unsupported
      combinations are rejected by h2h itself (fail-closed), not silently
      ignored by this action.
    required: false
    default: text
  report-file:
    description: >-
      File to write the command's output to. Defaults to
      "hushspec-<command>-report.<ext>" (ext derived from format) in the
      current working directory.
    required: false
    default: ""
  keyring:
    description: >-
      Path to a hushspec-keyring.v1.schema.json document, forwarded as
      --keyring to "h2h bundle verify".
    required: false
    default: ""
  github-token:
    description: >-
      Token used to list/download release assets and verify build
      provenance attestations. Defaults to the workflow's own GITHUB_TOKEN.
    required: false
    default: ${{ github.token }}

outputs:
  exit-code:
    description: >-
      Exit code of the h2h invocation (0 success, 1 policy/lint/test
      failure, 2 usage/input error). For bundle-verify and audit, which run
      once per matched file, this is the worst (highest) exit code seen.
    value: ${{ steps.run.outputs.exit-code }}
  report-path:
    description: "Path the command's output was written to."
    value: ${{ steps.run.outputs.report-path }}

runs:
  using: composite
  steps:
    - name: Resolve target platform
      id: platform
      shell: bash
      run: |
        set -euo pipefail
        case "$RUNNER_OS" in
          Linux) os=linux ;;
          macOS) os=darwin ;;
          Windows) os=windows ;;
          *) echo "::error::unsupported runner.os '${RUNNER_OS}'"; exit 1 ;;
        esac
        case "$RUNNER_ARCH" in
          X64) arch=x64 ;;
          ARM64) arch=arm64 ;;
          *) echo "::error::unsupported runner.arch '${RUNNER_ARCH}' (h2h publishes linux/macOS x64+arm64 and windows x64)"; exit 1 ;;
        esac
        # Keep this table in lockstep with release.yml's build matrix and
        # scripts/gen_npm_cli.mjs's PLATFORMS -- all three enumerate the same
        # five published targets.
        case "$os-$arch" in
          linux-x64)   target=x86_64-unknown-linux-gnu ;;
          linux-arm64) target=aarch64-unknown-linux-gnu ;;
          darwin-x64)  target=x86_64-apple-darwin ;;
          darwin-arm64) target=aarch64-apple-darwin ;;
          windows-x64) target=x86_64-pc-windows-msvc ;;
          *) echo "::error::no published h2h binary for $os-$arch"; exit 1 ;;
        esac
        bin=h2h
        [ "$os" = windows ] && bin=h2h.exe
        echo "target=$target" >> "$GITHUB_OUTPUT"
        echo "bin=$bin" >> "$GITHUB_OUTPUT"
        echo "bindir=${RUNNER_TEMP}/hushspec-action/bin" >> "$GITHUB_OUTPUT"

    - name: Install Rust toolchain (source build only)
      if: inputs.version == 'source'
      uses: dtolnay/rust-toolchain@stable

    - name: Build h2h from source
      if: inputs.version == 'source'
      shell: bash
      env:
        H2H_BINDIR: ${{ steps.platform.outputs.bindir }}
        H2H_ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        mkdir -p "$H2H_BINDIR"
        # H2H_ACTION_PATH is this action's own checkout -- the full hush
        # repository at the pinned ref, whether it was referenced locally
        # (uses: ./) or remotely (uses: backbay-labs/hush@<ref>) -- so
        # crates/hushspec-cli exists there regardless of what the caller's
        # own checkout looks like.
        cargo install --path "${H2H_ACTION_PATH}/crates/hushspec-cli" \
          --locked --root "${RUNNER_TEMP}/hushspec-action" --force
        echo "$H2H_BINDIR" >> "$GITHUB_PATH"

    # Resolved before the cache so the key names a concrete tag. Keying on
    # the raw input would give every `latest` run the same key, and the first
    # run's binary would then be reused for every release that follows.
    - name: Resolve release tag
      id: release
      if: inputs.version != 'source'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        repo=backbay-labs/hush
        tag="$INPUT_VERSION"
        if [ "$tag" = latest ]; then
          tag="$(gh release view --repo "$repo" --json tagName -q .tagName)" || {
            echo "::error::could not resolve the latest release for $repo (no releases published yet? pass version: source to build crates/hushspec-cli from this checkout instead)"
            exit 1
          }
        fi
        echo "tag=$tag" >> "$GITHUB_OUTPUT"

    - name: Cache h2h binary
      if: inputs.version != 'source'
      id: cache
      uses: actions/cache@v4
      with:
        path: ${{ steps.platform.outputs.bindir }}
        key: hushspec-h2h-${{ steps.release.outputs.tag }}-${{ steps.platform.outputs.target }}-v1

    - name: Download h2h release
      if: inputs.version != 'source' && steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        H2H_TAG: ${{ steps.release.outputs.tag }}
        H2H_TARGET: ${{ steps.platform.outputs.target }}
        H2H_BIN: ${{ steps.platform.outputs.bin }}
        H2H_BINDIR: ${{ steps.platform.outputs.bindir }}
      run: |
        set -euo pipefail
        repo=backbay-labs/hush
        tag="$H2H_TAG"
        target="$H2H_TARGET"
        bin="$H2H_BIN"
        bindir="$H2H_BINDIR"
        asset="h2h-${tag}-${target}.tar.gz"
        work="${RUNNER_TEMP}/hushspec-action/dl"
        mkdir -p "$work" "$bindir"

        echo "::group::Download $asset ($tag)"
        gh release download "$tag" --repo "$repo" \
          --pattern "$asset" --pattern SHA256SUMS \
          --dir "$work" --clobber
        echo "::endgroup::"

        cd "$work"
        if [ ! -f SHA256SUMS ]; then
          echo "::error::release $tag has no SHA256SUMS asset; refusing to trust an unverified binary"
          exit 1
        fi
        if ! grep -F " ${asset}" SHA256SUMS | sha256sum -c -; then
          echo "::error::SHA256SUMS verification failed for $asset"
          exit 1
        fi

        if gh attestation verify --help >/dev/null 2>&1; then
          if gh attestation verify "$asset" --repo "$repo"; then
            echo "::notice::build provenance attestation verified for $asset"
          else
            echo "::error::build provenance attestation did not verify for $asset"
            exit 1
          fi
        else
          echo "::notice::gh attestation verify is not available on this runner's gh CLI; skipping provenance check (SHA256SUMS integrity check above still ran)"
        fi

        tar -xzf "$asset"
        cp "h2h-${tag}-${target}/${bin}" "$bindir/${bin}"
        chmod +x "$bindir/${bin}" 2>/dev/null || true

    - name: Add h2h to PATH
      if: inputs.version != 'source'
      shell: bash
      env:
        H2H_BINDIR: ${{ steps.platform.outputs.bindir }}
      run: echo "$H2H_BINDIR" >> "$GITHUB_PATH"

    - name: Run h2h
      id: run
      shell: bash
      # Every input reaches the script through the environment: interpolating
      # one into the script text would let its contents be parsed as shell.
      env:
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_FAIL_ON_WARNINGS: ${{ inputs.fail-on-warnings }}
        INPUT_KEYRING: ${{ inputs.keyring }}
        INPUT_REPORT_FILE: ${{ inputs.report-file }}
        INPUT_PATHS: ${{ inputs.paths }}
      run: |
        set -euo pipefail
        command="$INPUT_COMMAND"
        format="$INPUT_FORMAT"
        fail_on_warnings="$INPUT_FAIL_ON_WARNINGS"
        keyring="$INPUT_KEYRING"
        report_file="$INPUT_REPORT_FILE"
        paths_input="$INPUT_PATHS"

        case "$format" in
          text) ext=txt ;;
          json) ext=json ;;
          sarif) ext=sarif ;;
          junit) ext=xml ;;
          *) ext=txt ;;
        esac
        [ -z "$report_file" ] && report_file="hushspec-${command}-report.${ext}"

        # paths: newline- or space-separated glob patterns.
        shopt -s nullglob globstar dotglob
        files=()
        while IFS= read -r pattern; do
          [ -z "$pattern" ] && continue
          matched=( $pattern )
          if [ ${#matched[@]} -eq 0 ]; then
            echo "::warning::pattern '$pattern' matched no files"
          else
            files+=( "${matched[@]}" )
          fi
        done < <(printf '%s\n' $paths_input)

        if [ ${#files[@]} -eq 0 ]; then
          echo "::error::no files matched paths='${paths_input}' -- refusing to run '${command}' with nothing to check (fail-closed)"
          exit 2
        fi

        : > "$report_file"
        exit_code=0

        case "$command" in
          validate|lint|test)
            args=("$command" "${files[@]}" --format "$format")
            if [ "$command" = lint ] && [ "$fail_on_warnings" = "true" ]; then
              args+=(--fail-on-warnings)
            fi
            set +e
            h2h "${args[@]}" | tee "$report_file"
            exit_code="${PIPESTATUS[0]}"
            set -e
            ;;
          audit|bundle-verify)
            for f in "${files[@]}"; do
              if [ "$command" = audit ]; then
                args=(audit "$f" --format "$format")
              else
                args=(bundle verify "$f" --format "$format")
                [ -n "$keyring" ] && args+=(--keyring "$keyring")
              fi
              set +e
              out="$(h2h "${args[@]}")"
              rc=$?
              set -e
              printf '%s\n' "$out"
              printf '%s\n' "$out" >> "$report_file"
              [ "$rc" -gt "$exit_code" ] && exit_code="$rc"
            done
            ;;
          *)
            echo "::error::unknown command '${command}' (expected validate, lint, test, audit, or bundle-verify)"
            exit 2
            ;;
        esac

        echo "exit-code=${exit_code}" >> "$GITHUB_OUTPUT"
        echo "report-path=${report_file}" >> "$GITHUB_OUTPUT"
        exit "$exit_code"
