name: Publish

on:
  workflow_dispatch:
    inputs:
      packages:
        description: 'Packages to publish (comma-separated: rust,npm,pypi or "all")'
        required: true
        default: 'all'
      dry_run:
        description: 'Dry run (no actual publish)'
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Gate: run full CI first ──────────────────────────────────────────
  ci:
    name: CI Gate
    uses: ./.github/workflows/ci.yml

  # ── Rust: publish hushspec then hushspec-cli to crates.io ──────────
  rust:
    name: Publish Rust crates
    needs: ci
    runs-on: ubuntu-latest
    if: >-
      contains(github.event.inputs.packages, 'rust') ||
      contains(github.event.inputs.packages, 'all')
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Stage rulesets for crate packaging
        run: |
          # hushspec crate uses include_str! to embed rulesets from workspace root.
          # cargo publish only packages files within the crate directory, so we
          # copy rulesets alongside the source before packaging.
          cp -r rulesets crates/hushspec/rulesets

      - name: Patch include_str paths for publish
        run: |
          # Rewrite include_str!("../../../rulesets/...") to include_str!("../rulesets/...")
          # so paths resolve within the packaged crate directory.
          sed -i 's|include_str!("../../../rulesets/|include_str!("../rulesets/|g' \
            crates/hushspec/src/resolve.rs \
            crates/hushspec/src/panic.rs

      - name: Publish hushspec (library)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            cargo publish -p hushspec --allow-dirty --dry-run
          elif cargo publish -p hushspec --allow-dirty 2>publish_err.log; then
            cat publish_err.log
          elif grep -qiE "already (uploaded|exists)" publish_err.log; then
            cat publish_err.log
            echo "::warning::hushspec version already on crates.io; continuing"
          else
            cat publish_err.log >&2
            echo "::error::hushspec publish failed (not an already-published error)"
            exit 1
          fi

      - name: Wait for crates.io index update
        if: github.event.inputs.dry_run != 'true'
        run: sleep 30

      - name: Publish hushspec-cli (h2h binary)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            cargo publish -p hushspec-cli --dry-run
          else
            cargo publish -p hushspec-cli
          fi

  # ── npm: publish @hushspec/core ────────────────────────────────────
  # NOTE: NPM_TOKEN must be an Automation or Granular Access Token
  # (not a "Publish" token) to bypass OTP in CI.
  npm:
    name: Publish npm package
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    if: >-
      contains(github.event.inputs.packages, 'npm') ||
      contains(github.event.inputs.packages, 'all')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish @hushspec/core
        working-directory: packages/hushspec
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            npm publish --access public --dry-run
          else
            npm publish --access public --provenance
          fi

  # ── PyPI: publish hushspec ─────────────────────────────────────────
  # ── PyPI: publish hushspec via trusted publishing (OIDC) ───────────
  #
  # No API token is used or stored. PyPI mints a short-lived credential from
  # this job's OIDC identity, which requires a trusted publisher configured on
  # the PyPI project "hushspec":
  #
  #   Owner:             backbay-labs
  #   Repository:        hush
  #   Workflow filename: publish.yml
  #   Environment:       (none)
  #
  # See https://docs.pypi.org/trusted-publishers/. Until that publisher exists
  # on PyPI, this job will fail at the upload step -- it will NOT silently fall
  # back to a token. If the job is ever moved or renamed, the PyPI trusted
  # publisher must be updated to match.
  pypi:
    name: Publish Python package
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required to mint the OIDC token PyPI exchanges for an upload credential.
      id-token: write
    if: >-
      contains(github.event.inputs.packages, 'pypi') ||
      contains(github.event.inputs.packages, 'all')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: pip install build twine

      - name: Build sdist and wheel
        working-directory: packages/python
        run: python -m build

      - name: Check distributions
        working-directory: packages/python
        run: twine check dist/*

      - name: Publish to PyPI
        if: github.event.inputs.dry_run != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/python/dist

      - name: Dry run — skipping upload
        if: github.event.inputs.dry_run == 'true'
        run: echo "Dry run — distributions built and checked, upload skipped"
