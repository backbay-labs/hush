name: Deploy Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Checks relative links inside the book source and the top-level README,
  # plus the external URLs they point at. Deliberately NOT a dependency of
  # `deploy`: an external site going down should not block a docs release.
  #
  # lychee (rather than the mdbook-linkcheck backend) so that `mdbook build
  # docs` keeps working for contributors and for the CI docs job without an
  # extra backend binary on PATH.
  link-check:
    name: Link Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: lycheeverse/lychee-action@v2
        with:
          # Code blocks are not checked (no --include-verbatim): the example
          # policies carry `$schema=` comments pointing at a host that is not
          # serving yet. Exclusions live in .lycheeignore, one justified line
          # each. Verified with lychee 0.24 against this tree: 91 OK,
          # 0 errors, 1 exclusion.
          args: >-
            --no-progress
            --max-retries 3
            --accept 200,204,206,429
            --exclude-path docs/book
            'docs/src/**/*.md'
            README.md
          fail: true
          jobSummary: true
          # Authenticates GitHub links so the many github.com/backbay-labs/hush
          # references do not trip the unauthenticated rate limit.
          token: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: latest

      - name: Build book
        run: mdbook build docs

      # Serves each schema at the URL its own `$id` declares
      # (https://hushspec.dev/schemas/<file>) and each spec registry at
      # https://hushspec.dev/registries/<file>, next to the book. `index.json`
      # is built from the directory that is being copied, so it can never name
      # a schema the site does not serve.
      - name: Publish schemas and registries at their canonical URLs
        env:
          HUSHSPEC_COMMIT: ${{ github.sha }}
        run: |
          mkdir -p docs/book/schemas docs/book/registries
          cp schemas/*.json docs/book/schemas/
          cp spec/registries/*.yaml docs/book/registries/
          python3 scripts/build_schema_index.py --out docs/book/schemas/index.json

      # `hushspec.dev` is the host every `$id` names, so the site claims it.
      #
      # This step does not assume the domain is bound: GitHub Pages serves the
      # site at its *.github.io URL regardless, and a CNAME file naming a
      # domain whose DNS does not point at GitHub Pages is inert -- it is
      # copied, never verified, so an unbound domain cannot fail the deploy.
      # Making the domain actually resolve is a one-time, maintainer-side step
      # outside this workflow: point hushspec.dev at GitHub Pages (an ALIAS or
      # ANAME record at the apex, or four A records for the Pages IPv4
      # addresses) and set it as the custom domain in the repository's Pages
      # settings. Until then, docs/src/reference/json-schema.md documents the
      # raw-GitHub fallback the schemas can be fetched from.
      - name: Claim the schema host
        run: cp docs/CNAME docs/book/CNAME

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/book

      - id: deployment
        uses: actions/deploy-pages@v4
