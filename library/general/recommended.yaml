# yaml-language-server: $schema=https://hushspec.dev/schemas/hushspec-core.v0.schema.json
# DISCLAIMER: Review and customize for your environment. Add
# organization-specific egress allowlists and forbidden paths as needed.
hushspec: "0.1.0"
name: recommended
description: >
  Production baseline. Extends the default with broad secret detection,
  sensible patch limits, and blocks for known-dangerous tools.
extends: "builtin:default"

rules:
  secret_patterns:
    patterns:
      - name: aws_access_key
        pattern: "(AKIA|ASIA)[0-9A-Z]{16}"
        severity: critical
        description: "AWS access key ID"
      - name: aws_secret_key
        pattern: "(?i)aws_secret_access_key[ \\t\\n\\r\\f]*[:=][ \\t\\n\\r\\f]*[A-Za-z0-9/+=]{40}"
        severity: critical
        description: "AWS secret access key"
      - name: github_token
        pattern: "gh[opsur]_[A-Za-z0-9]{36}"
        severity: critical
        description: "GitHub personal access token"
      - name: github_fine_grained_pat
        pattern: "github_pat_[0-9a-zA-Z_]{50,}"
        severity: critical
      - name: openai_key
        pattern: "sk-[A-Za-z0-9]{48}"
        severity: critical
        description: "OpenAI API key (legacy format)"
      - name: openai_project_key
        pattern: "sk-proj-[A-Za-z0-9_]{20,}"
        severity: critical
        description: "OpenAI project-scoped API key"
      - name: anthropic_key
        pattern: "sk-ant-[A-Za-z0-9_\\-]{95}"
        severity: critical
        description: "Anthropic API key"
      - name: private_key
        pattern: "-----BEGIN[ \\t\\n\\r\\f]+(RSA[ \\t\\n\\r\\f]+)?PRIVATE[ \\t\\n\\r\\f]+KEY-----"
        severity: critical
        description: "Private key material"
      - name: npm_token
        pattern: "npm_[A-Za-z0-9]{36}"
        severity: critical
        description: "NPM publish token"
      - name: slack_token
        pattern: "xox[baprs]-[0-9]{10,13}-[0-9]{10,13}[a-zA-Z0-9-]*"
        severity: critical
        description: "Slack API token"
      - name: generic_api_key
        pattern: "(?i)(api[_\\-]?key|apikey)[ \\t\\n\\r\\f]*[:=][ \\t\\n\\r\\f]*[A-Za-z0-9]{32,}"
        severity: error
        description: "Generic API key pattern"
      - name: connection_string
        pattern: "(?i)(postgres|mysql|mongodb|redis|amqp)://[^ \\t\\n\\r\\f\"']{10,}"
        severity: critical
        description: "Database connection string"
      - name: jwt_token
        pattern: "eyJ[A-Za-z0-9_-]{10,}\\.eyJ[A-Za-z0-9_-]{10,}\\.[A-Za-z0-9_-]+"
        severity: error
        description: "JWT token"
      - name: ssn
        pattern: "\\b[0-9]{3}-[0-9]{2}-[0-9]{4}\\b"
        severity: critical
        description: "Social Security Number"
    skip_paths:
      - "**/test/**"
      - "**/tests/**"
      - "**/fixtures/**"
      - "**/*.test.*"
      - "**/*_test.*"

  patch_integrity:
    max_additions: 1000
    max_deletions: 500
    require_balance: false
    max_imbalance_ratio: 10.0
    forbidden_patterns:
      - "(?i)disable[ \\t\\n\\r\\f_\\-]?(security|auth|ssl|tls)"
      - "(?i)skip[ \\t\\n\\r\\f_\\-]?(verify|validation|check)"
      - "(?i)rm[ \\t\\n\\r\\f]+-rf[ \\t\\n\\r\\f]+/"
      - "(?i)chmod[ \\t\\n\\r\\f]+777"
      - "(?i)eval[ \\t\\n\\r\\f]*\\("

  shell_commands:
    forbidden_patterns:
      - "(?i)rm[ \\t\\n\\r\\f]+-rf[ \\t\\n\\r\\f]+/"
      - "curl.*\\|.*sh"
      - "wget.*\\|.*bash"
      - "(?i)chmod[ \\t\\n\\r\\f]+777"

  tool_access:
    allow: []
    block:
      - shell_exec
      - run_command
      - raw_file_write
      - raw_file_delete
    require_confirmation:
      - file_write
      - file_delete
      - git_push
      - deploy
      - publish
    default: allow
    max_args_size: 1048576
