# HushSpec framework registry
#
# Normative companion to spec/hushspec-core.md Section 2.5 (Metadata). Lists the
# framework identifiers that `metadata.controls[].framework` may name, together
# with the shape every `control_id` for that framework must take.
#
# Registration is advisory: a document naming an unregistered framework is still
# a valid HushSpec document (the schema constrains only the id's character set).
# Linters SHOULD flag unregistered ids and ids that do not match their
# framework's `control_id_pattern`; engines MUST NOT reject a document for
# either reason, and MUST NOT let control mappings influence evaluation.
#
# `control_id_pattern` values are anchored regular expressions in the HushSpec
# regex profile (core Section 3.14): ASCII classes only, no lookaround, no
# backreferences.
#
# Schema: schemas/hushspec-framework-registry.v0.schema.json
registry_version: "0.1.0"

frameworks:
  - id: ferpa
    name: "Family Educational Rights and Privacy Act"
    version: "34 CFR Part 99"
    url: "https://www.ecfr.gov/current/title-34/subtitle-A/part-99"
    control_id_pattern: "^99\\.[0-9]{1,2}(\\([a-z0-9]+\\))*$"

  - id: hipaa-2013
    name: "HIPAA Security and Privacy Rules"
    version: "2013 Omnibus Rule (45 CFR Part 164)"
    url: "https://www.ecfr.gov/current/title-45/subtitle-A/subchapter-C/part-164"
    control_id_pattern: "^164\\.[0-9]{3}(\\([a-z]\\))?(\\([0-9]+\\))?(\\([ivxlc]+\\))?(\\([A-Z]\\))?$"

  - id: iso-27001-2022
    name: "ISO/IEC 27001 Annex A"
    version: "2022"
    url: "https://www.iso.org/standard/27001"
    control_id_pattern: "^A\\.[0-9]{1,2}\\.[0-9]{1,2}$"

  - id: nist-800-53-r5
    name: "NIST SP 800-53 Security and Privacy Controls"
    version: "Revision 5"
    url: "https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final"
    control_id_pattern: "^[A-Z]{2}-[0-9]{1,2}(\\([0-9]{1,2}\\))?$"

  - id: nist-ai-rmf-1.0
    name: "NIST AI Risk Management Framework"
    version: "1.0"
    url: "https://www.nist.gov/itl/ai-risk-management-framework"
    control_id_pattern: "^(GOVERN|MAP|MEASURE|MANAGE) [0-9]{1,2}\\.[0-9]{1,2}$"

  - id: owasp-llm-top10-2025
    name: "OWASP Top 10 for Large Language Model Applications"
    version: "2025"
    url: "https://owasp.org/www-project-top-10-for-large-language-model-applications/"
    control_id_pattern: "^LLM[0-9]{2}$"

  - id: pci-dss-4.0
    name: "Payment Card Industry Data Security Standard"
    version: "4.0"
    url: "https://www.pcisecuritystandards.org/document_library/"
    control_id_pattern: "^(Req )?[0-9]{1,2}(\\.[0-9]{1,2}){0,2}$"

  - id: soc2-tsc-2017
    name: "AICPA SOC 2 Trust Services Criteria"
    version: "2017 (with 2022 revised points of focus)"
    url: "https://www.aicpa-cima.com/resources/landing/system-and-organization-controls-soc-suite-of-services"
    control_id_pattern: "^(CC|A|C|PI|P)[0-9]{1,2}\\.[0-9]{1,2}$"
