[package]
name = "hushspec-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Agentic compliance as code: CLI for validating, testing, and scaffolding HushSpec policies"
repository = "https://github.com/backbay-labs/hush"
readme = "README.md"
keywords = ["ai", "security", "policy", "cli", "hushspec"]
categories = ["command-line-utilities"]

[[bin]]
name = "h2h"
path = "src/main.rs"

[dependencies]
hushspec = { version = "1.0", path = "../hushspec", features = ["signing"] }
clap = { version = "4", features = ["derive"] }
colored = "2"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
# Positional YAML parsing for lint spans. serde_yaml exposes no marks, so the
# raw event stream (with start/end markers) is re-scanned alongside it; this
# crate is dependency-free and never feeds policy evaluation.
saphyr-parser = "0.0.12"
serde_json = "1"
chrono = "0.4"
jsonschema = { version = "0.18", features = ["draft202012"] }
regex = "1"
similar = "3"
clap_complete = "4"
sha2 = "0.10"
same-file = "1"
tempfile = "3"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
