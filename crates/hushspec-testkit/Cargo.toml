[package]
name = "hushspec-testkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Conformance test runner, report generator, and differential fuzzer for HushSpec implementations"
readme = "README.md"
keywords = ["hushspec", "conformance", "testing", "fuzzing", "policy"]
categories = ["development-tools::testing", "config"]

[[bin]]
name = "hushspec-testkit"
path = "src/main.rs"

[[bin]]
name = "hushspec-gen"
path = "src/bin/hushspec-gen.rs"

[[bin]]
name = "hushspec-difftest"
path = "src/bin/hushspec-difftest.rs"

[dependencies]
# `signing` is not optional here: conformance Level 5 (Attested) is defined by
# the signing, log, receipt-signing and bundle vectors, and a runner that
# cannot verify them could only ever report Level 5 as not attempted.
hushspec = { version = "0.1", path = "../hushspec", features = ["signing"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
clap = { version = "4", features = ["derive"] }
colored = "2"
jsonschema = { version = "0.18", features = ["draft202012"] }
thiserror = "2"
# Exact-pinned: Cargo.lock is gitignored, so a semver-range dependency here
# could resolve a newer proptest whose RNG->value mapping differs across CI
# checkouts, silently breaking --seed / --seed-from-string reproducibility
# for hushspec-difftest. Bump deliberately, not automatically.
proptest = "=1.11.0"
tempfile = "3"
sha2 = "0.10"
chrono = "0.4"
tar = "0.4"
flate2 = "1"
