hushspec_test: "0.1.0"
description: "D3 (core 3.7): glob metacharacters in tool names are literal; danger_* does not match danger_zone"
policy:
  hushspec: "0.1.0"
  rules:
    tool_access:
      block:
        - "danger_*"
      default: allow
cases:
  - description: "an asterisk entry does not glob-match a similarly prefixed tool"
    action:
      type: tool_call
      target: danger_zone
    expect:
      decision: allow
      matched_rule: rules.tool_access.default
  - description: "an asterisk entry matches only the literal name"
    action:
      type: tool_call
      target: "danger_*"
    expect:
      decision: deny
      matched_rule: rules.tool_access.block
