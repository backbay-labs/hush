hushspec_test: "0.1.0"
description: "Pending D18 (posture 5.3, unchanged text): a transition with a named from takes priority over a wildcard from for the same trigger; the reference implementation currently picks the first in document order"
policy:
  hushspec: "0.1.0"
  rules:
    tool_access:
      default: allow
  extensions:
    posture:
      initial: standard
      states:
        standard:
          capabilities: [tool_call]
        restricted:
          capabilities: [tool_call]
        locked:
          capabilities: []
      transitions:
        - from: "*"
          to: locked
          on: critical_violation
        - from: standard
          to: restricted
          on: critical_violation
cases:
  - description: "the named-from transition wins over the wildcard listed before it"
    action:
      type: tool_call
      target: read_file
      posture:
        current: standard
        signal: critical_violation
    expect:
      decision: allow
      posture:
        current: standard
        next: restricted
  - description: "the wildcard applies to states with no named transition"
    action:
      type: tool_call
      target: read_file
      posture:
        current: restricted
        signal: critical_violation
    expect:
      decision: allow
      posture:
        current: restricted
        next: locked
