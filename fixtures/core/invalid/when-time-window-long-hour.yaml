# A three-digit hour field.
# A time_window bound is exactly two ASCII digits per component
# (schemas/hushspec-core.v1.schema.json $defs.TimeWindow), so "009:05" is not
# a time even though its value is in range.
hushspec: "0.1.0"
rules:
  shell_commands:
    when:
      time_window:
        start: "009:05"
        end: "17:00"
    forbidden_patterns: ["mkfs"]
