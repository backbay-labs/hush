# A negated class escape inside a bracket class. `\D`, `\W` and `\S` each name
# the complement of a set, which is not a set member: the HushSpec regex
# profile allows only `\d`, `\w` and `\s` inside a class, so all four SDKs must
# reject this document.
hushspec: "0.1.0"
rules:
  shell_commands:
    forbidden_patterns:
      - "rm[\\D]+"
