# A mid-pattern inline flag group. Rust `regex` and Go RE2 accept `(?i)`
# anywhere in a pattern; JavaScript and Python reject it outright. The HushSpec
# regex profile permits an inline flag group only as a single leading group, so
# all four SDKs must reject this document.
hushspec: "0.1.0"
rules:
  shell_commands:
    forbidden_patterns:
      - "rm\\s+-rf(?i)FORCE"
