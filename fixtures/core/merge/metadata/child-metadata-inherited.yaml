# core 2.5 and 4.1: a child that omits `metadata` inherits the base's object
# unchanged, control mappings included -- governance survives an overlay that
# does not speak to it.
hushspec: "0.2.0"
name: child-metadata-inherited
extends: base
rules:
  egress:
    allow:
      - "c.example.com"
    default: block
