hushspec_test: "0.1.0"
description: >-
  secret_patterns applicability for egress and tool_call is keyed on the
  *presence* of `content` (core spec 3.4: "only when `content` is present"),
  not on it being non-empty. An explicitly empty payload is still scanned --
  and a pattern that matches the empty string still fires -- while an absent
  payload leaves the block unevaluated. Pinned by the cross-SDK differential
  fuzzer (P1-12): the Go SDK modelled `content` as a plain string, which
  conflated "" with absent and allowed the first case below.

policy:
  hushspec: "0.2.0"
  name: secret-patterns-content-presence
  rules:
    secret_patterns:
      enabled: true
      patterns:
        - name: matches_empty
          pattern: "x*"
          severity: critical

cases:
  - description: tool_call with an explicitly empty content payload is scanned
    action:
      type: tool_call
      target: some_tool
      content: ""
    expect:
      decision: deny
      matched_rule: rules.secret_patterns.patterns.matches_empty
      reason: content matched secret pattern 'matches_empty'

  - description: tool_call with no content payload is not scanned at all
    action:
      type: tool_call
      target: some_tool
    expect:
      decision: allow

  - description: egress with an explicitly empty content payload is scanned
    action:
      type: egress
      target: api.example.com
      content: ""
    expect:
      decision: deny
      matched_rule: rules.secret_patterns.patterns.matches_empty
      reason: content matched secret pattern 'matches_empty'

  - description: egress with no content payload is not scanned at all
    action:
      type: egress
      target: api.example.com
    expect:
      decision: allow

  - description: file_write is always scanned, empty content included
    action:
      type: file_write
      target: /workspace/notes.txt
      content: ""
    expect:
      decision: deny
      matched_rule: rules.secret_patterns.patterns.matches_empty
      reason: content matched secret pattern 'matches_empty'
