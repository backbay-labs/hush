hushspec_test: "0.1.0"
description: "Guardrail mode denies unlisted actions; supersedes the warn expectation in fixtures/core/evaluation/computer-use.test.yaml (core spec 3.8)"
policy:
  hushspec: "0.1.0"
  rules:
    computer_use:
      enabled: true
      mode: guardrail
      allowed_actions:
        - remote.session.connect
cases:
  - description: "a listed action is allowed"
    action:
      type: computer_use
      target: "remote.session.connect"
    expect:
      decision: allow
      matched_rule: rules.computer_use.allowed_actions
  - description: "an unlisted action is denied in guardrail mode"
    action:
      type: computer_use
      target: "remote.file_transfer"
    expect:
      decision: deny
      matched_rule: rules.computer_use.mode
