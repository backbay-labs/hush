hushspec_test: "0.1.0"
description: "A custom action is permitted only when the current posture state grants the custom capability (core spec 5, posture spec 3.3)"
policy:
  hushspec: "0.1.0"
  extensions:
    posture:
      initial: open
      states:
        open:
          capabilities: [custom]
        locked:
          capabilities: []
      transitions: []
cases:
  - description: "posture state granting custom permits a custom action"
    action:
      type: custom
      target: "engine-defined"
      posture:
        current: open
    expect:
      decision: allow
      posture:
        current: open
        next: open
  - description: "posture state without custom denies a custom action"
    action:
      type: custom
      target: "engine-defined"
      posture:
        current: locked
    expect:
      decision: deny
      matched_rule: extensions.posture.states.locked.capabilities
      posture:
        current: locked
        next: locked
