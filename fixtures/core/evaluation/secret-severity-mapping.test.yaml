# yaml-language-server: $schema=https://hushspec.org/schemas/hushspec-evaluator-test.v1.schema.json
hushspec_test: "0.1.0"
description: "Every secret severity maps to exactly one decision -- `warn` warns, `error` denies, `critical` denies -- and when several patterns match one payload the strictest severity decides and names its own pattern (core spec 3.4, 6.1)."
policy:
  hushspec: "0.2.0"
  name: secret-severity-map
  rules:
    secret_patterns:
      patterns:
        - name: warn_token
          pattern: "WARNTOKEN[0-9]+"
          severity: warn
        - name: error_token
          pattern: "ERRORTOKEN[0-9]+"
          severity: error
        - name: critical_token
          pattern: "CRITICALTOKEN[0-9]+"
          severity: critical
cases:
  - description: "severity warn produces warn, not deny"
    action:
      type: file_write
      target: "/repo/src/a.txt"
      content: "WARNTOKEN1"
    expect:
      decision: warn
      matched_rule: rules.secret_patterns.patterns.warn_token
  - description: "severity error produces deny"
    action:
      type: file_write
      target: "/repo/src/a.txt"
      content: "ERRORTOKEN1"
    expect:
      decision: deny
      matched_rule: rules.secret_patterns.patterns.error_token
  - description: "severity critical produces deny"
    action:
      type: file_write
      target: "/repo/src/a.txt"
      content: "CRITICALTOKEN1"
    expect:
      decision: deny
      matched_rule: rules.secret_patterns.patterns.critical_token
  - description: "warn and error in one payload: error is stricter and decides"
    action:
      type: file_write
      target: "/repo/src/a.txt"
      content: "WARNTOKEN1 ERRORTOKEN2"
    expect:
      decision: deny
      matched_rule: rules.secret_patterns.patterns.error_token
  - description: "error and critical in one payload: critical is strictest and decides"
    action:
      type: file_write
      target: "/repo/src/a.txt"
      content: "ERRORTOKEN1 CRITICALTOKEN2"
    expect:
      decision: deny
      matched_rule: rules.secret_patterns.patterns.critical_token
  - description: "a warn-severity secret on an egress action warns, so the mapping is not file-write-specific"
    action:
      type: egress
      target: "api.example.com"
      content: "WARNTOKEN9"
    expect:
      decision: warn
      matched_rule: rules.secret_patterns.patterns.warn_token
  - description: "content with no match is allowed"
    action:
      type: file_write
      target: "/repo/src/a.txt"
      content: "nothing to see"
    expect:
      decision: allow
