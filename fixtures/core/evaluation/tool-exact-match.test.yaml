hushspec_test: "0.1.0"
description: "Tool names are exact, case-sensitive strings; no prefix or glob matching (core spec 3.7)"
policy:
  hushspec: "0.1.0"
  rules:
    tool_access:
      block:
        - shell_exec
        - "danger_*"
      require_confirmation:
        - deploy
      default: allow
cases:
  - description: "a blocked tool name matches exactly"
    action:
      type: tool_call
      target: shell_exec
    expect:
      decision: deny
      matched_rule: rules.tool_access.block
  - description: "a tool name that merely extends a blocked name is not blocked"
    action:
      type: tool_call
      target: shell_exec2
    expect:
      decision: allow
      matched_rule: rules.tool_access.default
  - description: "a prefix of a blocked name is not blocked"
    action:
      type: tool_call
      target: shell
    expect:
      decision: allow
      matched_rule: rules.tool_access.default
  - description: "matching is case-sensitive"
    action:
      type: tool_call
      target: Shell_Exec
    expect:
      decision: allow
      matched_rule: rules.tool_access.default
  - description: "a literal asterisk in a tool name matches only that literal name"
    action:
      type: tool_call
      target: "danger_*"
    expect:
      decision: deny
      matched_rule: rules.tool_access.block
  - description: "confirmation-gated tool name matches exactly"
    action:
      type: tool_call
      target: deploy
    expect:
      decision: warn
      matched_rule: rules.tool_access.require_confirmation
