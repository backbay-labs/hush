# yaml-language-server: $schema=https://hushspec.org/schemas/hushspec-evaluator-test.v1.schema.json
hushspec_test: "0.2.0"
description: "A policy declaring hushspec 1.0.0 evaluates exactly as a 0.2.0 policy would (core spec 2.2, 10): the 1.0 series froze the 0.2 semantics"
policy:
  hushspec: "1.0.0"
  name: one-point-zero
  rules:
    forbidden_paths:
      patterns:
        - "**/.ssh/**"
    egress:
      allow:
        - "api.example.com"
      default: block
    tool_access:
      block:
        - shell_exec
      default: allow
cases:
  - description: "a forbidden path is denied"
    action:
      type: file_read
      target: "/home/agent/.ssh/id_ed25519"
    expect:
      decision: deny
      matched_rule: rules.forbidden_paths.patterns
      reason: "path matched a forbidden pattern"
  - description: "an allowlisted host is allowed"
    action:
      type: egress
      target: "api.example.com"
    expect:
      decision: allow
      matched_rule: rules.egress.allow
      reason: "domain is explicitly allowed"
  - description: "a host outside the allowlist falls to the block default"
    action:
      type: egress
      target: "evil.example.net"
    expect:
      decision: deny
      matched_rule: rules.egress.default
      reason: "domain matched default block"
  - description: "a blocked tool is denied"
    action:
      type: tool_call
      target: shell_exec
    expect:
      decision: deny
      matched_rule: rules.tool_access.block
      reason: "tool is explicitly blocked"
