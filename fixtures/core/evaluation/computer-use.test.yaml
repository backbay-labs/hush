# NOTE: the "warn on unlisted action (guardrail mode)" case below encodes 0.1.0
# behavior. Spec 0.2.0 (D9, core 3.8) ratifies deny; the superseding vector is
# fixtures/staged/0.2.0/core/evaluation/computer-use-guardrail-deny.test.yaml.
# Rewrite that case to deny when the staged vector is promoted.
hushspec_test: "0.1.0"
description: "Computer use guard evaluation"
policy:
  hushspec: "0.1.0"
  rules:
    computer_use:
      enabled: true
      mode: guardrail
      allowed_actions:
        - remote.session.connect
        - remote.session.disconnect
        - input.inject
cases:
  - description: "allow listed action"
    action:
      type: computer_use
      target: "remote.session.connect"
    expect:
      decision: allow
      matched_rule: rules.computer_use.allowed_actions
  - description: "warn on unlisted action (guardrail mode)"
    action:
      type: computer_use
      target: "remote.file_transfer"
    expect:
      decision: warn
      matched_rule: rules.computer_use.mode
  - description: "allow input injection"
    action:
      type: computer_use
      target: "input.inject"
    expect:
      decision: allow
      matched_rule: rules.computer_use.allowed_actions
