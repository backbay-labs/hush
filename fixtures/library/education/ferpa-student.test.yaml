# yaml-language-server: $schema=https://hushspec.org/schemas/hushspec-evaluator-test.v1.schema.json
#
# Control-tagged suite for library/education/ferpa-student.yaml.
# Every case names the control it is evidence for, and between them the
# cases hit every rule block and every named secret pattern of the
# resolved policy -- `h2h test --fail-on-uncovered` is the gate.
#
# The suite extends the embedded copy of the policy, so it runs against
# exactly the bytes the SDKs ship; `scripts/generate_*_builtins.py
# --check` is what keeps that copy equal to the file.
hushspec_test: "0.2.0"
description: "ferpa-student: control-tagged evaluation suite for the vertical library policy"
policy:
  hushspec: "0.1.0"
  name: ferpa-student-suite
  extends: "builtin:library/education/ferpa-student"
cases:
  - description: "an approved destination is allowed (canvas.instructure.com)"
    controls:
      - framework: ferpa
        control_id: "99.33"
    tags: ["allow", "egress"]
    action:
      type: "egress"
      target: "canvas.instructure.com"
    expect:
      decision: allow
      matched_rule: "rules.egress.allow"
  - description: "a blocked destination is denied (drive.google.com)"
    controls:
      - framework: ferpa
        control_id: "99.33"
    tags: ["deny", "egress"]
    action:
      type: "egress"
      target: "drive.google.com"
    expect:
      decision: deny
      matched_rule: "rules.egress.block"
  - description: "an unlisted destination is denied by default"
    controls:
      - framework: ferpa
        control_id: "99.33"
    tags: ["deny", "egress", "fail-closed"]
    action:
      type: "egress"
      target: "analytics.example.com"
    expect:
      decision: deny
      matched_rule: "rules.egress.default"
  - description: "education records are unreachable"
    controls:
      - framework: ferpa
        control_id: "99.3"
    tags: ["deny", "paths"]
    action:
      type: "file_read"
      target: "/srv/app/transcripts/2026/spring.csv"
    expect:
      decision: deny
      matched_rule: "rules.forbidden_paths.patterns"
  - description: "a declared exception is readable"
    controls:
      - framework: ferpa
        control_id: "99.3"
    tags: ["allow", "paths"]
    action:
      type: "file_read"
      target: "/srv/app/.env.example"
    expect:
      decision: allow
      matched_rule: "rules.forbidden_paths.exceptions"
  - description: "a forbidden shell command is denied (scp roster.csv host:/tmp)"
    controls:
      - framework: ferpa
        control_id: "99.33"
    tags: ["deny", "shell"]
    action:
      type: "shell_command"
      target: "scp roster.csv host:/tmp"
    expect:
      decision: deny
      matched_rule: "rules.shell_commands.forbidden_patterns[3]"
  - description: "an ordinary build command is allowed (npm run build)"
    controls:
      - framework: ferpa
        control_id: "99.33"
    tags: ["allow", "shell"]
    action:
      type: "shell_command"
      target: "npm run build"
    expect:
      decision: allow
  - description: "a patch larger than max_additions (500) is denied"
    controls:
      - framework: ferpa
        control_id: "99.30"
    tags: ["deny", "patch"]
    action:
      type: "patch_apply"
      target: "/srv/app/service.py"
      content: "+line 0\n+line 1\n+line 2\n+line 3\n+line 4\n+line 5\n+line 6\n+line 7\n+line 8\n+line 9\n+line 10\n+line 11\n+line 12\n+line 13\n+line 14\n+line 15\n+line 16\n+line 17\n+line 18\n+line 19\n+line 20\n+line 21\n+line 22\n+line 23\n+line 24\n+line 25\n+line 26\n+line 27\n+line 28\n+line 29\n+line 30\n+line 31\n+line 32\n+line 33\n+line 34\n+line 35\n+line 36\n+line 37\n+line 38\n+line 39\n+line 40\n+line 41\n+line 42\n+line 43\n+line 44\n+line 45\n+line 46\n+line 47\n+line 48\n+line 49\n+line 50\n+line 51\n+line 52\n+line 53\n+line 54\n+line 55\n+line 56\n+line 57\n+line 58\n+line 59\n+line 60\n+line 61\n+line 62\n+line 63\n+line 64\n+line 65\n+line 66\n+line 67\n+line 68\n+line 69\n+line 70\n+line 71\n+line 72\n+line 73\n+line 74\n+line 75\n+line 76\n+line 77\n+line 78\n+line 79\n+line 80\n+line 81\n+line 82\n+line 83\n+line 84\n+line 85\n+line 86\n+line 87\n+line 88\n+line 89\n+line 90\n+line 91\n+line 92\n+line 93\n+line 94\n+line 95\n+line 96\n+line 97\n+line 98\n+line 99\n+line 100\n+line 101\n+line 102\n+line 103\n+line 104\n+line 105\n+line 106\n+line 107\n+line 108\n+line 109\n+line 110\n+line 111\n+line 112\n+line 113\n+line 114\n+line 115\n+line 116\n+line 117\n+line 118\n+line 119\n+line 120\n+line 121\n+line 122\n+line 123\n+line 124\n+line 125\n+line 126\n+line 127\n+line 128\n+line 129\n+line 130\n+line 131\n+line 132\n+line 133\n+line 134\n+line 135\n+line 136\n+line 137\n+line 138\n+line 139\n+line 140\n+line 141\n+line 142\n+line 143\n+line 144\n+line 145\n+line 146\n+line 147\n+line 148\n+line 149\n+line 150\n+line 151\n+line 152\n+line 153\n+line 154\n+line 155\n+line 156\n+line 157\n+line 158\n+line 159\n+line 160\n+line 161\n+line 162\n+line 163\n+line 164\n+line 165\n+line 166\n+line 167\n+line 168\n+line 169\n+line 170\n+line 171\n+line 172\n+line 173\n+line 174\n+line 175\n+line 176\n+line 177\n+line 178\n+line 179\n+line 180\n+line 181\n+line 182\n+line 183\n+line 184\n+line 185\n+line 186\n+line 187\n+line 188\n+line 189\n+lin