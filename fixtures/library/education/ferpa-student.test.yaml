    expect:
      decision: deny
      matched_rule: "rules.patch_integrity.max_additions"
  - description: "a patch that weakens a control is denied"
    controls:
      - framework: ferpa
        control_id: "99.30"
    tags: ["deny", "patch"]
    action:
      type: "patch_apply"
      target: "/srv/app/service.py"
      content: "+# skip validation of enrollment\n"
    expect:
      decision: deny
      matched_rule: "rules.patch_integrity.forbidden_patterns[1]"
  - description: "a small balanced patch is allowed"
    controls:
      - framework: ferpa
        control_id: "99.30"
    tags: ["allow", "patch"]
    action:
      type: "patch_apply"
      target: "/srv/app/service.py"
      content: "+added one\n+added two\n-removed one\n"
    expect:
      decision: allow
  - description: "an allowlisted tool is allowed (read_file)"
    controls:
      - framework: ferpa
        control_id: "99.31"
    tags: ["allow", "tools"]
    action:
      type: "tool_call"
      target: "read_file"
    expect:
      decision: allow
      matched_rule: "rules.tool_access.allow"
  - description: "a blocked tool is denied (database_query)"
    controls:
      - framework: ferpa
        control_id: "99.31"
    tags: ["deny", "tools"]
    action:
      type: "tool_call"
      target: "database_query"
    expect:
      decision: deny
      matched_rule: "rules.tool_access.block"
  - description: "a tool requiring confirmation warns (git_push)"
    controls:
      - framework: ferpa
        control_id: "99.31"
    tags: ["warn", "tools"]
    action:
      type: "tool_call"
      target: "git_push"
    expect:
      decision: warn
      matched_rule: "rules.tool_access.require_confirmation"
  - description: "an unlisted tool is denied in allowlist mode"
    controls:
      - framework: ferpa
        control_id: "99.31"
    tags: ["deny", "tools", "fail-closed"]
    action:
      type: "tool_call"
      target: "browse_web"
    expect:
      decision: deny
      matched_rule: "rules.tool_access.allow"
  - description: "tool arguments above max_args_size (524288) are denied"
    controls:
      - framework: ferpa
        control_id: "99.31"
    tags: ["deny", "tools"]
    action:
      type: "tool_call"
      target: "read_file"
      args_size: 524289
    expect:
      decision: deny
      matched_rule: "rules.tool_access.max_args_size"
  - description: "the scanner denies student_id in written content"
    controls:
      - framework: ferpa
        control_id: "99.3"
    tags: ["deny", "secrets", "student_id"]
    action:
      type: "file_write"
      target: "/srv/app/notes/handoff.md"
      content: "student id: S12345678"
    expect:
      decision: deny
      matched_rule: "rules.secret_patterns.patterns.student_id"
  - description: "the scanner denies ssn in written content"
    controls:
      - framework: ferpa
        control_id: "99.3"
    tags: ["deny", "secrets", "ssn"]
    action:
      type: "file_write"
      target: "/srv/app/notes/handoff.md"
      content: "guardian ssn: 123-45-6789"
    expect:
      decision: deny
      matched_rule: "rules.secret_patterns.patterns.ssn"
  - description: "the scanner denies student_name_pattern in written content"
    controls:
      - framework: ferpa
        control_id: "99.3"
    tags: ["deny", "secrets", "student_name_pattern"]
    action:
      type: "file_write"
      target: "/srv/app/notes/handoff.md"
      content: "student name: Jane Doe"
    expect:
      decision: deny
      matched_rule: "rules.secret_patterns.patterns.student_name_pattern"
  - description: "the scanner denies grade_record in written content"
    controls:
      - framework: ferpa
        control_id: "99.3"
    tags: ["deny", "secrets", "grade_record"]
    action:
      type: "file_write"
      target: "/srv/app/notes/handoff.md"
      content: "gpa = 3"
    expect:
      decision: deny
      matched_rule: "rules.secret_patterns.patterns.grade_record"
  - description: "the scanner denies date_of_birth in written content"
    controls:
      - framework: ferpa
        control_id: "99.3"
    tags: ["deny", "secrets", "date_of_birth"]
    action:
      type: "file_write"
      target: "/srv/app/notes/handoff.md"
      content: "DOB: 04/11/2008"
    expect:
      decision: deny
      matched_rule: "rules.secret_patterns.patterns.date_of_birth"
  - description: "the scanner denies financial_aid_amount in written content"
    controls:
      - framework: ferpa
        control_id: "99.3"
    tags: ["deny", "secrets", "financial_aid_amount"]
    action:
      type: "file_write"
      target: "/srv/app/notes/handoff.md"
      content: "financial aid = $4,250"
    expect:
      decision: deny
      matched_rule: "rules.secret_patterns.patterns.financial_aid_amount"
  - description: "the scanner denies aws_access_key in written content"
    controls:
      - framework: ferpa
        control_id: "99.3"
    tags: ["deny", "secrets", "aws_access_key"]
    action:
      type: "file_write"
      target: "/srv/app/notes/handoff.md"
      content: "AKIAABCDEFGHIJKLMNOP"
    expect:
      decision: deny
      matched_rule: "rules.secret_patterns.patterns.aws_access_key"
  - description: "the scanner denies private_key in written content"
    controls:
      - framework: ferpa
        control_id: "99.3"
    tags: ["deny", "secrets", "private_key"]
    action:
      type: "file_write"
      target: "/srv/app/notes/handoff.md"
      content: "-----BEGIN RSA PRIVATE KEY-----"
    expect:
      decision: deny
      matched_rule: "rules.secret_patterns.patterns.private_key"
  - description: "the scanner denies generic_api_key in written content"
    controls:
      - framework: ferpa
        control_id: "99.3"
    tags: ["deny", "secrets", "generic_api_key"]
    action:
      type: "file_write"
      target: "/srv/app/notes/handoff.md"
      content: "api_key: A1b2C3d4E5f6G7h8J9k0L1m2N3p4Q5r6"
    expect:
      decision: deny
      matched_rule: "rules.secret_patterns.patterns.generic_api_key"
  - description: "a secret under a skip path is not scanned"
    controls:
      - framework: ferpa
        control_id: "99.3"
    tags: ["allow", "secrets"]
    action:
      type: "file_write"
      target: "/srv/app/test/srv/app/fixture_keys.py"
      content: "AKIAABCDEFGHIJKLMNOP"
    expect:
      decision: allow
