# yaml-language-server: $schema=https://hushspec.dev/schemas/hushspec-evaluator-test.v0.schema.json
#
# Control-tagged suite for library/general/recommended.yaml (RFC 09 P3-03).
# Every case names the control it is evidence for, and between them the
# cases hit every rule block and every named secret pattern of the
# resolved policy -- `h2h test --fail-on-uncovered` is the gate.
#
# The suite extends the embedded copy of the policy, so it runs against
# exactly the bytes the SDKs ship; `scripts/generate_*_builtins.py
# --check` is what keeps that copy equal to the file.
hushspec_test: "0.2.0"
description: "recommended: control-tagged evaluation suite for the vertical library policy"
policy:
  hushspec: "0.1.0"
  name: recommended-suite
  extends: "builtin:library/general/recommended"
cases:
  - description: "an approved destination is allowed (api.github.com)"
    controls:
      - framework: owasp-llm-top10-2025
        control_id: "LLM03"
    tags: ["allow", "egress"]
    action:
      type: "egress"
      target: "api.github.com"
    expect:
      decision: allow
      matched_rule: "rules.egress.allow"
  - description: "an unlisted destination is denied by default"
    controls:
      - framework: owasp-llm-top10-2025
        control_id: "LLM03"
    tags: ["deny", "egress", "fail-closed"]
    action:
      type: "egress"
      target: "paste.example.com"
    expect:
      decision: deny
      matched_rule: "rules.egress.default"
  - description: "credential stores are unreachable"
    controls:
      - framework: owasp-llm-top10-2025
        control_id: "LLM02"
    tags: ["deny", "paths"]
    action:
      type: "file_read"
      target: "/home/agent/.aws/credentials"
    expect:
      decision: deny
      matched_rule: "rules.forbidden_paths.patterns"
  - description: "a forbidden shell command is denied (dd if=/dev/zero of=/dev/sda)"
    controls:
      - framework: owasp-llm-top10-2025
        control_id: "LLM06"
    tags: ["deny", "shell"]
    action:
      type: "shell_command"
      target: "dd if=/dev/zero of=/dev/sda"
    expect:
      decision: deny
      matched_rule: "rules.shell_commands.forbidden_patterns[4]"
  - description: "an ordinary build command is allowed (npm run build)"
    controls:
      - framework: owasp-llm-top10-2025
        control_id: "LLM06"
    tags: ["allow", "shell"]
    action:
      type: "shell_command"
      target: "npm run build"
    expect:
      decision: allow
  - description: "a patch larger than max_additions (1000) is denied"
