[workspace]
resolver = "2"
members = [
    "crates/hushspec",
    "crates/hushspec-testkit",
    "crates/hushspec-cli",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
# MSRV. Edition 2024 alone only needs 1.85, but the sources use let-chains
# (`if let ... && ...`), stable since 1.88, and the committed Cargo.lock
# pins `time` 0.3.53 which also declares 1.88. Verified by the "MSRV" CI job;
# raise this only together with that job's pinned toolchain.
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/backbay-labs/hush"
