# yaml-language-server: $schema=https://hushspec.dev/schemas/hushspec-core.v0.schema.json
hushspec: "0.1.0"
name: cicd
description: Security rules for CI/CD pipelines

rules:
  forbidden_paths:
    patterns:
      - "**/.ssh/**"
      - "**/id_rsa*"
      - "**/id_ed25519*"
      - "**/id_ecdsa*"
      - "**/.aws/**"
      - "**/.env"
      - "**/.env.*"
      - "**/.git-credentials"
      - "**/.gnupg/**"
      - "**/.kube/**"
      - "**/.docker/**"
      - "**/.npmrc"
      - "**/.github/secrets/**"
      - "**/.gitlab-ci-secrets/**"
      - "**/.circleci/secrets/**"
    exceptions:
      - "**/.github/workflows/**"
      - "**/.gitlab-ci.yml"
      - "**/.circleci/config.yml"

  egress:
    allow:
      # Package registries
      - "*.npmjs.org"
      - "registry.npmjs.org"
      - "pypi.org"
      - "files.pythonhosted.org"
      - "crates.io"
      - "static.crates.io"
      - "rubygems.org"
      - "packagist.org"
      - "plugins.gradle.org"
      # Container registries
      - "*.docker.io"
      - "*.docker.com"
      - "*.gcr.io"
      - "*.ecr.aws"
      - "ghcr.io"
      # Build tools
      - "repo1.maven.org"
      - "services.gradle.org"
    block: []
    default: block

  secret_patterns:
    patterns:
      - name: aws_access_key
        pattern: "(AKIA|ASIA)[0-9A-Z]{16}"
        severity: critical
      - name: github_token
        pattern: "gh[opsur]_[A-Za-z0-9]{36}"
        severity: critical
      - name: github_fine_grained_pat
        pattern: "github_pat_[0-9a-zA-Z_]{50,}"
        severity: critical
      - name: private_key
        pattern: "-----BEGIN[ \\t\\n\\r\\f]+(RSA[ \\t\\n\\r\\f]+)?PRIVATE[ \\t\\n\\r\\f]+KEY-----"
        severity: critical
    skip_paths:
      - "**/test/**"
      - "**/tests/**"

  shell_commands:
    forbidden_patterns:
      - "(?i)rm[ \\t\\n\\r\\f]+-rf[ \\t\\n\\r\\f]+/"
      - "curl.*\\|.*sh"
      - "wget.*\\|.*bash"
      - "(?i)mkfs"
      - "(?i)dd[ \\t\\n\\r\\f]+if="
      - "(?i)chmod[ \\t\\n\\r\\f]+777"
      - "(?i)>[ \\t\\n\\r\\f]*/dev/sd"

  tool_access:
    allow:
      - read_file
      - write_file
      - list_directory
      - run_tests
      - build
    block:
      - shell_exec
      - deploy_production
    default: block
